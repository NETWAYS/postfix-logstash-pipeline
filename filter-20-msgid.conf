filter {
  # local added: messages delivered locally by local(8) still carry a queue ID prefix
  if [postfix][component] in ["qmgr","smtp","submission","lmtp","local","cleanup","smtpd"] and [message] =~ /^\w+:/ {
    if [message] !~ /^warning|^NOQUEUE/ {
      grok {
        match => ["message","%{WORD:[postfix][msgid]}: %{GREEDYDATA:message}"]
        overwrite => "message"
        tag_on_failure => ["_grokparsefailure","postfix_msgidfailed"]
        id => "postfix_msgid"
      }
    }
  }
}

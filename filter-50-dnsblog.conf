filter {
  if [postfix][component] == "dnsblog" {

    if [message] =~ /^addr/ {
      grok {
        match => ["message", "addr %{IP:[client][address]} listed by domain %{HOSTNAME:[postfix][dnsbl][name]} as %{IP:[postfix][dnsbl][result]}"]
        id => "postfix_dnsbl"
        tag_on_failure => ["_grokparsefailure", "postfix_dnsbl_failed"]
        add_field => {
          "[postfix][eventtype]" => "dnsbl"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^warning: dnsblog_query:/ {
      # DNS lookup failed for a DNSBL query (e.g. network error or NXDOMAIN)
      grok {
        match => ["message", "warning: dnsblog_query: lookup error for DNS query %{DATA:[postfix][dnsbl][query]}: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_dnsbl_lookup_error"
        tag_on_failure => ["_grokparsefailure", "postfix_dnsbl_lookup_error_failed"]
        add_field => {
          "[postfix][eventtype]" => "dnsbl_lookup_error"
        }
        add_tag => "grokked"
      }
    }

    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }
    }

  }
}

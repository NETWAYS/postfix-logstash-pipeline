filter {
  if [postfix][component] == "smtp" {
    grok {
      # optional groups handle both full delivery logs and plain error messages
      match => ["message", "(to=<%{DATA:[destination][user][email]}>(, orig_to=<%{DATA:[postfix][orig_to]}>)?, relay=%{HOSTNAME:[server][address]}\[%{IP:[server][ip]}\]:%{NUMBER:[server][port]:int}, delay=%{NUMBER:[postfix][delay]:float}, delays=%{DATA:[postfix][delays]}, dsn=%{DATA:[postfix][dsn]}, status=%{WORD:[postfix][status]} \()?%{GREEDYDATA:[postfix][detail]}(\))?"]
      id => "postfix_smtp"
      tag_on_failure => ["_grokparsefailure", "postfix_smtp_failed"]
      add_field => {
        "[postfix][eventtype]" => "smtp_to"
      }
      add_tag => "grokked"
    }

    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }

      # numeric status_code used by the OpenSearch upsert script to track final delivery outcome
      # sent=1 wins over deferred=2 wins over bounced=3 (higher code = worse outcome)
      if [postfix][status] == "sent" {
        mutate { add_field => { "[postfix][status_code]" => "1" } }
      } else if [postfix][status] == "deferred" {
        mutate { add_field => { "[postfix][status_code]" => "2" } }
      } else if [postfix][status] == "bounced" {
        mutate { add_field => { "[postfix][status_code]" => "3" } }
      }
      if [postfix][status_code] {
        mutate { convert => { "[postfix][status_code]" => "integer" } }
      }
    }
  }
}

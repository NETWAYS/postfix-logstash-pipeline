filter {

  # ECS-compliant targets: client.geo.* and server.geo.*
  # A single event is not expected to carry both client.ip and server.ip
  # at the same time — if that changes, revisit this filter.

  if [server][ip] {
    geoip {
      source => "[server][ip]"
      target => "[server][geo]"
    }
  }

  if [client][ip] {
    geoip {
      source => "[client][ip]"
      target => "[client][geo]"
    }
  }

}

filter {
  # IPv4 starts with a digit; IPv6 contains a colon (including ::1 loopback)
  if [client][address] =~ /^\d|:/ {
    if ![client][ip] {
      mutate {
        add_field => {
          "[client][ip]" => "%{[client][address]}"
        }
      }
    }
  } else if [client][address] =~ /^\D/ {
    if ![client][domain] {
      mutate {
        add_field => {
          "[client][domain]" => "%{[client][address]}"
        }
      }
    }
  }
}

filter {
  if [postfix][component] == "qmgr" {

    if [message] == "removed" {
      mutate {
        add_field => {
          "[postfix][eventtype]" => "qmgr_removed"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^skipped/ {
      # message is still being delivered, qmgr skips further attempts
      mutate {
        add_field => {
          "[postfix][eventtype]" => "qmgr_skipped"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /status=expired/ {
      # message exceeded maximal_queue_lifetime and is returned to sender
      grok {
        match => ["message", "from=<%{DATA:[source][user][email]}>, status=expired, returned to sender"]
        id => "postfix_qmgr_expired"
        tag_on_failure => ["_grokparsefailure", "postfix_qmgr_expired_failed"]
        add_field => {
          "[postfix][eventtype]" => "qmgr_expired"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^warning: mail for/ {
      # active queue is filling up for a destination — important for capacity monitoring
      grok {
        match => ["message", "warning: mail for %{DATA:[postfix][clog_destination]} is using up %{NUMBER:[postfix][clog_used]:int} of %{NUMBER:[postfix][clog_limit]:int} active queue entries"]
        id => "postfix_qmgr_clog"
        tag_on_failure => ["_grokparsefailure", "postfix_qmgr_clog_failed"]
        add_field => {
          "[postfix][eventtype]" => "qmgr_clog_warning"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /message rejected:/ {
      # corrupted queue file (e.g. after a crash or disk error)
      grok {
        match => ["message", "message rejected: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_qmgr_corrupt"
        tag_on_failure => ["_grokparsefailure", "postfix_qmgr_corrupt_failed"]
        add_field => {
          "[postfix][eventtype]" => "qmgr_corrupt"
        }
        add_tag => "grokked"
      }

    } else {
      grok {
        match => ["message","from=<%{DATA:[source][user][email]}>, size=%{NUMBER:[postfix][size]:int}, nrcpt=%{NUMBER:[postfix][nrcpt]:int} \(%{DATA:[postfix][detail]}\)"]
        id => "postfix_qmgr"
        tag_on_failure => ["_grokparsefailure","postfix_qmgr_failed"]
        add_field => {
          "[postfix][eventtype]" => "qmgr_from"
        }
        add_tag => "grokked"
      }

      # empty sender address indicates a bounce notification
      if [source][user][email] == "" {
        mutate {
          add_field => {
            "[postfix][is_bounce]" => "true"
          }
        }
      }
    }

    # only add ECS version when parsing succeeded
    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }
    }
  }
}

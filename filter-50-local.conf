filter {
  if [postfix][component] == "local" {
    grok {
      match => ["message", "to=<%{DATA:[destination][user][email]}>(, orig_to=<%{DATA:[postfix][orig_to]}>)?, relay=%{HOSTNAME:[postfix][relay]}, delay=%{NUMBER:[postfix][delay]:float}, delays=%{DATA:[postfix][delays]}, dsn=%{DATA:[postfix][dsn]}, status=%{WORD:[postfix][status]} \(%{GREEDYDATA:[postfix][detail]}\)"]
      id => "postfix_local"
      tag_on_failure => ["_grokparsefailure", "postfix_local_failed"]
      add_field => {
        "[postfix][eventtype]" => "local_to"
      }
      add_tag => "grokked"
    }

    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }

      if [postfix][status] == "sent" {
        mutate { add_field => { "[postfix][status_code_temp]" => "1" } }
      } else if [postfix][status] == "deferred" {
        mutate { add_field => { "[postfix][status_code_temp]" => "2" } }
      } else if [postfix][status] == "bounced" {
        mutate { add_field => { "[postfix][status_code_temp]" => "3" } }
      }
      if [postfix][status_code] {
        mutate { convert => { "[postfix][status_code_temp]" => "integer" } }
      }
    }
  }
}

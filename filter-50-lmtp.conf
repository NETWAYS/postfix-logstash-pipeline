filter {
  if [postfix][component] == "lmtp" {

    if [message] =~ /relay=\S+\[\S+\]:\d+,/ {
      # LMTP over TCP: relay=hostname[ip]:port
      grok {
        match => ["message", "to=<%{DATA:[destination][user][email]}>(, orig_to=<%{DATA:[postfix][orig_to]}>)?, relay=%{HOSTNAME:[server][address]}\[%{IP:[server][ip]}\]:%{NUMBER:[server][port]:int}, delay=%{NUMBER:[postfix][delay]:float}, delays=%{DATA:[postfix][delays]}, dsn=%{DATA:[postfix][dsn]}, status=%{WORD:[postfix][status]} \(%{GREEDYDATA:[postfix][detail]}\)"]
        id => "postfix_lmtp"
        tag_on_failure => ["_grokparsefailure", "postfix_lmtp_failed"]
        add_field => {
          "[postfix][eventtype]" => "lmtp_to"
        }
        add_tag => "grokked"
      }

    } else {
      # LMTP over unix socket: relay=hostname[/path/to/socket] or relay=hostname[path][unix]
      # relay is stored as raw string since IP/port are not available for local sockets
      grok {
        match => ["message", "to=<%{DATA:[destination][user][email]}>(, orig_to=<%{DATA:[postfix][orig_to]}>)?, relay=%{DATA:[postfix][relay]}, delay=%{NUMBER:[postfix][delay]:float}, delays=%{DATA:[postfix][delays]}, dsn=%{DATA:[postfix][dsn]}, status=%{WORD:[postfix][status]} \(%{GREEDYDATA:[postfix][detail]}\)"]
        id => "postfix_lmtp_unix"
        tag_on_failure => ["_grokparsefailure", "postfix_lmtp_unix_failed"]
        add_field => {
          "[postfix][eventtype]" => "lmtp_to"
        }
        add_tag => "grokked"
      }
    }

    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }

      if [postfix][status] == "sent" {
        mutate { add_field => { "[postfix][status_code_temp2]" => "1" } }
      } else if [postfix][status] == "deferred" {
        mutate { add_field => { "[postfix][status_code_temp2]" => "2" } }
      } else if [postfix][status] == "bounced" {
        mutate { add_field => { "[postfix][status_code_temp2]" => "3" } }
      }
      if [postfix][status_code_temp2] {
        mutate { convert => { "[postfix][status_code_temp2]" => "integer" } }
      }
    }

  }
}

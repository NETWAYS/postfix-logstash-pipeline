filter {

  if [postfix][component] == "cleanup" {

    if [message] =~ /^message-id=/ {
      grok {
        match => ["message", "message-id=<%{DATA:[postfix][msgid_long]}>"]
        tag_on_failure => ["_grokparsefailure", "postfix_cleanup_failed"]
        id => "postfix_cleanup"
        add_field => {
          "[postfix][eventtype]" => "cleanup"
        }
        add_tag => "grokked"
      }
    }

    if [message] =~ /^milter-reject:/ {
      # covers all milter stages: CONNECT, HELO, MAIL, RCPT, DATA, END-OF-MESSAGE
      grok {
        match => ["message", "milter-reject: %{NOTSPACE:[postfix][milter_stage]} from %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\]: %{GREEDYDATA:[postfix][detail]}"]
        tag_on_failure => ["_grokparsefailure", "postfix_cleanup_milter_failed"]
        id => "postfix_cleanup_milter"
        add_field => {
          "[postfix][eventtype]" => "cleanup_milter"
        }
        add_tag => "grokked"
      }
    }

    if [message] =~ /^reject: header/ {
      grok {
        # fixed: from= writes to [source][user][email], to= writes to [destination][user][email]
        # fixed: [postfix][proto] was previously misspelled as [postfx][proto]
        match => ["message", "reject: header %{DATA:[postfix][header]} from %{HOSTNAME:[client][address]}\[%{IP:[client][ip]}\]; from=<(%{DATA:[source][user][email]})?> to=<%{DATA:[destination][user][email]}> proto=%{WORD:[postfix][proto]} helo=%{DATA:[postfix][helo]}: %{GREEDYDATA:[postfix][detail]}"]
        tag_on_failure => ["_grokparsefailure", "postfix_cleanup_reject_header_failed"]
        id => "postfix_cleanup_reject_header"
        add_field => {
          "[postfix][eventtype]" => "cleanup_reject_header"
        }
        add_tag => "grokked"
      }
    }

    if [message] =~ /^reject: body/ {
      grok {
        match => ["message", "reject: body %{DATA:[postfix][body_text]} from %{HOSTNAME:[client][address]}\[%{IP:[client][ip]}\]; from=<(%{DATA:[source][user][email]})?> to=<%{DATA:[destination][user][email]}> proto=%{WORD:[postfix][proto]} helo=%{DATA:[postfix][helo]}: %{GREEDYDATA:[postfix][detail]}"]
        tag_on_failure => ["_grokparsefailure", "postfix_cleanup_reject_body_failed"]
        id => "postfix_cleanup_reject_body"
        add_field => {
          "[postfix][eventtype]" => "cleanup_reject_body"
        }
        add_tag => "grokked"
      }
    }

    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }
    }

  }
}

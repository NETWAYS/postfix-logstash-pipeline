filter {
  if [postfix][component] == "smtps" {

    if [message] =~ /connect from/ {
      grok {
        match => ["message", "(dis)?connect from %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\](%{GREEDYDATA:[@metadata][connectdetail]})?"]
        id => "postfix_smtps_connect"
        tag_on_failure => ["_grokparsefailure", "postfix_smtps_connect_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtps_connect"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^lost connection after/ {
      # client dropped the connection before completing the SMTP exchange (e.g. timeout or abort)
      grok {
        match => ["message", "lost connection after %{WORD:[postfix][action]} from %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\]"]
        id => "postfix_smtps_lostconnection"
        tag_on_failure => ["_grokparsefailure", "postfix_smtps_lostconnection_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtps_lostconnection"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^SSL_accept error from/ {
      # TLS handshake failed — client may have sent plain text to a TLS-only port
      grok {
        match => ["message", "SSL_accept error from %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\]: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_smtps_ssl_error"
        tag_on_failure => ["_grokparsefailure", "postfix_smtps_ssl_error_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtps_ssl_error"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^Anonymous TLS connection established from/ {
      # TLS session without client certificate verification (opportunistic encryption)
      grok {
        match => ["message", "Anonymous TLS connection established from %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\]: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_smtps_anontls"
        tag_on_failure => ["_grokparsefailure", "postfix_smtps_anontls_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtps_anontls"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^warning: .*authentication failed/ {
      grok {
        match => ["message", "warning: %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\]: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_smtps_authenticationfailed"
        tag_on_failure => ["_grokparsefailure", "postfix_smtps_authenticationfailed_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtps_authenticationfailed"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^warning: TLS library problem/ {
      # TLS handshake or certificate error reported by OpenSSL
      grok {
        match => ["message", "warning: TLS library problem: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_smtps_tls_error"
        tag_on_failure => ["_grokparsefailure", "postfix_smtps_tls_error_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtps_tls_error"
        }
        add_tag => "grokked"
      }
    }

    if [@metadata][connectdetail] {
      kv {
        source => "[@metadata][connectdetail]"
        target => "[postfix]"
      }
    }

    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }
    }

  }
}

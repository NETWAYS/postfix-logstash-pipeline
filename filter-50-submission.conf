filter {
  if [postfix][component] == "submission" {

    # matches connect from and disconnect from
    # not very efficient to check every log this way
    # contributions with better checks are very welcome :-)
    if [message] =~ /connect from/ {
      grok {
        match => ["message", "(dis)?connect from %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\](%{GREEDYDATA:[@metadata][connectdetail]})?"]
        id => "postfix_submission_connect"
        tag_on_failure => ["_grokparsefailure", "postfix_submission_connect_failed"]
        add_field => {
          "[postfix][eventtype]" => "submission_connect"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^lost connection after/ {
      # client dropped the connection before completing the SMTP exchange (e.g. MUA timeout or abort)
      grok {
        match => ["message", "lost connection after %{WORD:[postfix][action]} from %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\]"]
        id => "postfix_submission_lostconnection"
        tag_on_failure => ["_grokparsefailure", "postfix_submission_lostconnection_failed"]
        add_field => {
          "[postfix][eventtype]" => "submission_lostconnection"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^Anonymous TLS connection established from/ {
      grok {
        match => ["message", "Anonymous TLS connection established from %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\]: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_submission_anontls"
        tag_on_failure => ["_grokparsefailure", "postfix_submission_anontls_failed"]
        add_field => {
          "[postfix][eventtype]" => "submission_anontls"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^warning: .*authentication failed/ {
      grok {
        match => ["message", "warning: %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\]: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_submission_authenticationfailed"
        tag_on_failure => ["_grokparsefailure", "postfix_submission_authenticationfailed_failed"]
        add_field => {
          "[postfix][eventtype]" => "submission_authenticationfailed"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^warning: TLS library problem/ {
      # TLS handshake or certificate error reported by OpenSSL
      grok {
        match => ["message", "warning: TLS library problem: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_submission_tls_error"
        tag_on_failure => ["_grokparsefailure", "postfix_submission_tls_error_failed"]
        add_field => {
          "[postfix][eventtype]" => "submission_tls_error"
        }
        add_tag => "grokked"
      }
    }

    if [@metadata][connectdetail] {
      kv {
        source => "[@metadata][connectdetail]"
        target => "[postfix]"
      }
    }

    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }
    }

  }
}

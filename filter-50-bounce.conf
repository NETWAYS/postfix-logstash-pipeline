filter {
  if [postfix][component] == "bounce" {

    if [message] =~ /^sender non-delivery notification:/ {
      # NDR (non-delivery report) generated by bounce(8) and sent back to the original sender
      grok {
        match => ["message", "sender non-delivery notification: %{DATA:[postfix][remote_msgid]}"]
        tag_on_failure => ["_grokparsefailure", "postfix_bounce_failed"]
        id => "postfix_bounce"
        add_field => {
          "[postfix][eventtype]" => "bounce"
        }
        add_tag => "grokked"
      }

    } else if [message] =~ /^postmaster copies:/ {
      # copy of bounce notification sent to postmaster (error_notice_recipient)
      grok {
        match => ["message", "postmaster copies: %{DATA:[postfix][remote_msgid]}"]
        tag_on_failure => ["_grokparsefailure", "postfix_bounce_postmaster_failed"]
        id => "postfix_bounce_postmaster"
        add_field => {
          "[postfix][eventtype]" => "bounce_postmaster"
        }
        add_tag => "grokked"
      }
    }

    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }
    }

  }
}

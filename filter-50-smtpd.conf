filter {
  if [postfix][component] == "smtpd" {

    # matches connect from and disconnect from
    # not very efficient to check every log this way
    # contributions with better checks are very welcome :-)
    if [message] =~ /connect from/ {
      grok {
        match => ["message", "(dis)?connect from %{HOSTNAME:[client][address]}\[%{IP:[client][ip]}\](%{GREEDYDATA:[@metadata][connectdetail]})?"]
        id => "postfix_smtpd_connect"
        tag_on_failure => ["_grokparsefailure", "postfix_smtpd_connect_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtpd_connect"
        }
        add_tag => "grokked"
      }
    }

    if [message] =~ /^lost connection after/ {
      grok {
        match => ["message", "lost connection after %{WORD:[postfix][action]} from %{HOSTNAME:[client][address]}\[%{IP:[client][ip]}\]"]
        id => "postfix_smtpd_lostconnection"
        tag_on_failure => ["_grokparsefailure", "postfix_smtpd_lostconnection_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtpd_lostconnection"
        }
        add_tag => "grokked"
      }
    }

    if [message] =~ /^client=/ {
      grok {
        match => ["message", "client=%{HOSTNAME:[client][address]}\[%{IP:[client][ip]}\]"]
        id => "postfix_smtpd_client"
        tag_on_failure => ["_grokparsefailure", "postfix_smtpd_client_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtpd_client"
        }
        add_tag => "grokked"
      }
    }

    if [message] =~ /^Anonymous TLS connection established from/ {
      grok {
        match => ["message", "Anonymous TLS connection established from %{HOSTNAME:[client][domain]}\[%{IP:[client][address]}\]: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_smtpd_anontls"
        tag_on_failure => ["_grokparsefailure", "postfix_smtpd_anontls_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtpd_anontls"
        }
        add_tag => "grokked"
      }
    }

    if [message] =~ /^NOQUEUE: reject:/ {
      # rejection before a queue ID is assigned (e.g. spam, relay denied, unknown recipient)
      grok {
        match => ["message", "NOQUEUE: reject: %{WORD:[postfix][reject_stage]} from %{HOSTNAME:[client][address]}\[%{IP:[client][ip]}\]: %{DATA:[postfix][reject_code]} %{GREEDYDATA:[postfix][detail]}; from=<%{DATA:[source][user][email]}> to=<%{DATA:[destination][user][email]}> proto=%{WORD:[postfix][proto]} helo=<%{DATA:[postfix][helo]}>"]
        id => "postfix_smtpd_noqueue_reject"
        tag_on_failure => ["_grokparsefailure", "postfix_smtpd_noqueue_reject_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtpd_reject"
        }
        add_tag => "grokked"
      }
    }

    if [message] =~ /^warning: hostname .* does not resolve/ {
      # reverse DNS mismatch — client hostname does not resolve back to its IP
      grok {
        match => ["message", "warning: hostname %{HOSTNAME:[client][domain]} does not resolve to address %{IP:[client][ip]}"]
        id => "postfix_smtpd_rdns_mismatch"
        tag_on_failure => ["_grokparsefailure", "postfix_smtpd_rdns_mismatch_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtpd_rdns_mismatch"
        }
        add_tag => "grokked"
      }
    }

    if [message] =~ /^warning: .* SASL .* authentication failed/ {
      grok {
        match => ["message", "warning: %{HOSTNAME:[client][address]}\[%{IP:[client][ip]}\]: SASL %{WORD:[postfix][sasl_method]} authentication failed: %{GREEDYDATA:[postfix][detail]}"]
        id => "postfix_smtpd_auth_failed"
        tag_on_failure => ["_grokparsefailure", "postfix_smtpd_auth_failed_failed"]
        add_field => {
          "[postfix][eventtype]" => "smtpd_auth_failed"
        }
        add_tag => "grokked"
      }
    }

    if [@metadata][connectdetail] {
      kv {
        source => "[@metadata][connectdetail]"
        target => "[postfix]"
      }
    }

    if "grokked" in [tags] {
      mutate {
        add_field => {
          "[ecs][version]" => "9.3.0"
        }
      }
    }

  }
}
